<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arko Network — Travel Simple Flow</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Diagram */
    .diagram {
      position: relative;
      width: 745px;
      height: 200px;
    }

    .connectors {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    /* Node Cards */
    .node {
      position: absolute;
      width: 175px;
      height: 168px;
      background: #162040;
      border: 1px solid #2A3A62;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px 14px;
    }

    .node-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .node-logo {
      width: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chip {
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: center;
    }

    .chip-primary {
      background: #4966FF;
      color: #FFFFFF;
    }

    .chip-secondary {
      background: rgba(0, 201, 167, 0.15);
      border: 1px solid #00C9A7;
      color: #00C9A7;
    }
  </style>
</head>

<body>

  <!-- Diagram -->
  <div class="diagram">

    <!-- SVG Connector Layer -->
    <svg class="connectors" viewBox="0 0 745 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
          <polygon points="0 0, 12 4, 0 8" fill="#4966FF" />
        </marker>
      </defs>

      <!--
        Cards: 175×168px  |  Gap: 110px (50% of 220px)
        C1=0  C2=285  C3=570
        Row top=16, center_y=16+84=100
      -->

      <!-- Arrow 1: Merchant → Arko Network -->
      <path d="M 176 100 L 283 100" stroke="#4966FF" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)" />
      <circle cx="230" cy="100" r="12" fill="#4966FF" />
      <text x="230" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700"
        fill="white">1</text>

      <!-- Arrow 2: Arko Network → Merchant Bank -->
      <path d="M 461 100 L 568 100" stroke="#4966FF" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)" />
      <circle cx="515" cy="100" r="12" fill="#4966FF" />
      <text x="515" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700"
        fill="white">2</text>
    </svg>

    <!-- Node 1: Merchant (col1) -->
    <div class="node" style="left:0px; top:16px;">
      <div class="node-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="11" width="18" height="10" rx="1" stroke="white" stroke-width="1.8" fill="none" />
          <path d="M3 11l2-6h14l2 6" stroke="white" stroke-width="1.8" stroke-linejoin="round" fill="none" />
          <path d="M9 21V15h6v6" stroke="white" stroke-width="1.8" stroke-linejoin="round" fill="none" />
          <path d="M9 11a3 3 0 01-6 0" stroke="white" stroke-width="1.5" fill="none" />
          <path d="M15 11a3 3 0 01-6 0" stroke="white" stroke-width="1.5" fill="none" />
          <path d="M21 11a3 3 0 01-6 0" stroke="white" stroke-width="1.5" fill="none" />
        </svg>
      </div>
      <span class="chip chip-secondary">Merchant</span>
    </div>

            </g>
          </g>
          <defs>
            <clipPath id="nc2clip0">
              <rect width="1200" height="583" fill="white" />
            </clipPath>
            <clipPath id="nc2clip1">
              <rect width="1200" height="432.356" fill="white" />
            </clipPath>
          </defs>
        </svg>
      </div>
      <span class="chip chip-primary">Arko Network</span>
    </div>

    <!-- Node 3: Merchant Bank (col3) -->
    <div class="node" style="left:570px; top:16px;">
      <div class="node-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 21h18" stroke="white" stroke-width="1.8" stroke-linecap="round" />
          <path d="M3 10h18" stroke="white" stroke-width="1.8" stroke-linecap="round" />

          <path d="M12 3L21 10H3L12 3Z" stroke="white" stroke-width="1.8" stroke-linejoin="round" fill="none" />
        </svg>
      </div>
      <span class="chip chip-secondary">Supplier</span>
    </div>

  </div><!-- /diagram -->

</body>

</html>
