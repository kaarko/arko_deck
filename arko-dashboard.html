<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arko Network — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #6366F1;
      --accent-hover: #4F46E5;
      --accent-light: rgba(99, 102, 241, 0.08);
      --accent-glow: rgba(99, 102, 241, 0.15);
      --bg: #FAFBFF;
      --card-bg: #FFFFFF;
      --text-primary: #2D2F3A;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
      --border: #E5E7EB;
      --green: #10B981;
      --green-light: rgba(16, 185, 129, 0.1);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .dashboard {
      max-width: 900px;
      width: 100%;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 48px;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-mark {
      width: 48px;
      height: 48px;
      position: relative;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .logo-text span {
      color: var(--accent);
    }

    .logo-subtitle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: -2px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--green-light);
      color: var(--green);
      font-size: 12px;
      font-weight: 600;
      border-radius: 100px;
      letter-spacing: 0.02em;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px -8px rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.2);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #818CF8);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-icon {
      width: 44px;
      height: 44px;
      background: var(--accent-light);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .card-icon svg {
      width: 22px;
      height: 22px;
      color: var(--accent);
    }

    .card-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 42px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 8px;
    }

    .card-value .unit {
      font-size: 24px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .trend-up {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: var(--green);
      font-weight: 600;
      font-size: 12px;
    }

    /* Footer */
    .footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .footer .divider {
      width: 60px;
      height: 1px;
      background: var(--border);
      margin: 0 auto 16px;
    }

    /* Responsive */
    @media (max-width: 700px) {
      body { padding: 20px; }
      .cards-grid { grid-template-columns: 1fr; gap: 16px; }
      .card-value { font-size: 36px; }
      .header { flex-direction: column; gap: 16px; align-items: flex-start; }
    }

    /* Subtle background pattern */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 20% 20%, rgba(99,102,241,0.03) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(99,102,241,0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    /* Entry animation */
    .card { opacity: 0; animation: fadeUp 0.6s ease forwards; }
    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.2s; }
    .card:nth-child(3) { animation-delay: 0.3s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- Header -->
    <div class="header">
      <div class="logo-section">
        <div>
          <svg class="logo-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <text x="0" y="36" font-family="Inter, sans-serif" font-weight="700" font-size="34" fill="#2D2F3A">ark</text>
            <circle cx="42" cy="28" r="5.5" fill="none" stroke="#6366F1" stroke-width="3"/>
            <circle cx="42" cy="24.5" r="5.5" fill="none" stroke="#2D2F3A" stroke-width="3"/>
          </svg>
        </div>
        <div>
          <div class="logo-text">arko<span>.</span></div>
          <div class="logo-subtitle">Network</div>
        </div>
      </div>
      <div class="badge">Operacional</div>
    </div>

    <!-- KPI Cards -->
    <div class="cards-grid">
      <!-- TPV -->
      <div class="card">
        <div class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <div class="card-label">TPV</div>
        <div class="card-value">10.260<span class="unit">M</span></div>
        <div class="card-subtitle">Volume total processado</div>
      </div>

      <!-- Receita -->
      <div class="card">
        <div class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <polyline points="17 5 12 1 7 5"/>
            <polyline points="7 19 12 23 17 19"/>
          </svg>
        </div>
        <div class="card-label">Receita</div>
        <div class="card-value">90.3<span class="unit">K</span></div>
        <div class="card-subtitle">Receita gerada</div>
      </div>

      <!-- Avg Fee -->
      <div class="card">
        <div class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="5" x2="5" y2="19"/>
            <circle cx="6.5" cy="6.5" r="2.5"/>
            <circle cx="17.5" cy="17.5" r="2.5"/>
          </svg>
        </div>
        <div class="card-label">Avg Fee</div>
        <div class="card-value">0.88<span class="unit">%</span></div>
        <div class="card-subtitle">Taxa média por transação</div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="divider"></div>
      Arko Network &middot; Dashboard de Performance
    </div>
  </div>
</body>
</html>
